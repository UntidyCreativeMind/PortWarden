name: Publish Docker image

# Builds the image and pushes it to GitHub Container Registry:
#   push to main      -> ghcr.io/untidycreativemind/portwarden:latest
#   push to a branch  -> ghcr.io/untidycreativemind/portwarden:<branch>
#   push a v* tag     -> ghcr.io/untidycreativemind/portwarden:<tag>
on:
  push:
    branches: ['main', 'v*']
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/untidycreativemind/portwarden

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
