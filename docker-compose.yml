# Ready to paste into a Portainer stack (web editor) - no .env or environment variables needed.
services:
  portwarden:
    # Published by GitHub Actions on every push to main
    image: ghcr.io/untidycreativemind/portwarden:latest
    container_name: portwarden
    restart: unless-stopped
    ports:
      - "9876:3001"
    volumes:
      # Database, generated SSH key and login secret all live here
      - portwarden-data:/app/backend/data
    depends_on:
      - docker-proxy
    security_opt:
      - no-new-privileges:true

  # Exposes only the read-only "list containers" part of the Docker API.
  # Mounting /var/run/docker.sock directly (even :ro) gives full root-equivalent control of the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: portwarden-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true

volumes:
  portwarden-data:
